<!DOCTYPE html>
<html lang="pl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
<script>
// Skróty na ekranie głównym telefonu potrafią pokazywać zbuforowaną, starą
// wersję strony. Porównujemy wersję TEJ strony (document.lastModified) z wersją
// na serwerze (HEAD bez cache) i przy nowszej przeładowujemy raz. Klucz
// 'pf_hub_zuzia_page_version' trzyma stałą wartość, bo stare kopie strony (sprzed 30.09.2026)
// porównują go z serwerem — dzięki temu same przeskakują na świeżą wersję.
(function(){
  var pageMs = Date.parse(document.lastModified);
  try{ localStorage.setItem('pf_hub_zuzia_page_version', 'nowy-mechanizm'); }catch(e){}
  try{
    fetch(location.pathname, { method:'HEAD', cache:'no-store' }).then(function(res){
      var serverMs = Date.parse(res.headers.get('last-modified') || '');
      if(isNaN(serverMs) || isNaN(pageMs) || serverMs - pageMs < 5000) return;
      var guard = 'pf_hub_zuzia_page_version_reload_' + serverMs;
      if(sessionStorage.getItem(guard)) return;
      sessionStorage.setItem(guard, '1');
      // Unikalny ?v= wymusza pobranie z sieci (GitHub Pages trzyma cache 10 min);
      // pozostałe parametry, np. ?pin= z linku w mailu, zostają.
      var q = new URLSearchParams(location.search); q.set('v', Date.now());
      location.replace(location.pathname + '?' + q.toString());
    }).catch(function(){});
    // Odśwież zbuforowaną kopię spod gołego adresu — to ją otwierają skróty i rozdzielacze.
    fetch(location.pathname, { cache:'reload' }).catch(function(){});
  }catch(e){}
})();
</script>
<title>Narzędzia</title>
<style>
  :root{
    --bg:#12181d; --panel:#1b232a; --panel2:#212b33; --line:#2c3841;
    --ink:#e8edf1; --ink-dim:#8fa0ab; --amber:#e8a33d; --green:#4caf7d;
    --red:#d9695f; --blue:#5b9bd5; --radius:10px;
  }
  *{box-sizing:border-box; -webkit-tap-highlight-color:transparent;}
  body{
    margin:0; background:var(--bg); color:var(--ink);
    font-family:'Segoe UI',Roboto,Arial,sans-serif;
    min-height:100vh; padding:24px 16px 40px;
  }
  .wrap{ max-width:480px; margin:0 auto; }
  h1{ font-size:20px; font-weight:600; margin:8px 0 4px; }
  .sub{ color:var(--ink-dim); font-size:13px; margin:0 0 24px; line-height:1.5; }
  .card{
    display:flex; align-items:center; gap:14px;
    background:var(--panel); border:1px solid var(--line); border-radius:var(--radius);
    padding:16px; margin-bottom:12px; text-decoration:none; color:var(--ink);
  }
  .card:active{ background:var(--panel2); }
  .icon{
    width:44px; height:44px; flex:0 0 44px; border-radius:10px;
    background:var(--panel2); display:flex; align-items:center; justify-content:center;
    font-size:22px;
  }
  .txt{ min-width:0; }
  .name{ font-size:15.5px; font-weight:600; margin:0 0 2px; }
  .desc{ font-size:12.5px; color:var(--ink-dim); margin:0; line-height:1.4; }
  .arrow{ margin-left:auto; color:var(--ink-dim); font-size:18px; flex:0 0 auto; }
</style>
</head>
<body>
<div class="wrap">
  <h1>Narzędzia</h1>
  <p class="sub">Dodaj tę stronę do ekranu początkowego telefonu — stąd wejdziesz
    do obu narzędzi.</p>

  <a class="card" href="https://heatcoolfulawkawro-ui.github.io/wydatki-domowe/">
    <div class="icon">🛍️</div>
    <div class="txt">
      <p class="name">Wydatki domowe</p>
      <p class="desc">Paragony, zestawienia miesięczne i porównanie cen</p>
    </div>
    <div class="arrow">›</div>
  </a>

  <a class="card" href="https://heatcoolfulawkawro-ui.github.io/gotowka-pf/">
    <div class="icon">💵</div>
    <div class="txt">
      <p class="name">Gotówka PF</p>
      <p class="desc">Pula gotówki, pobrania i dopłaty</p>
    </div>
    <div class="arrow">›</div>
  </a>
</div>
</body>
</html>
